name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # cosign keyless OIDC + SLSA provenance attestation
  attestations: write

jobs:
  build:
    name: reproducible build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.83'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # --frozen + --locked pin the build to Cargo.lock for
      # reproducibility. We don't pass --offline because CI runners
      # don't have a populated cargo cache by default; --locked already
      # gives us byte-exact dep versions.
      - name: build
        run: |
          cargo build --release --frozen --locked \
            --target ${{ matrix.target }} \
            -p oc-guardian-cli

      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oc-guardian \
             dist/oc-guardian-${{ matrix.target }}
          cd dist
          tar -czf oc-guardian-${{ matrix.target }}.tar.gz \
                   oc-guardian-${{ matrix.target }}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 oc-guardian-${{ matrix.target }}.tar.gz \
              > oc-guardian-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum oc-guardian-${{ matrix.target }}.tar.gz \
              > oc-guardian-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign keyless sign
        run: |
          cosign sign-blob --yes \
            --output-signature dist/oc-guardian-${{ matrix.target }}.sig \
            --output-certificate dist/oc-guardian-${{ matrix.target }}.cert \
            --bundle dist/oc-guardian-${{ matrix.target }}.bundle \
            dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: SLSA Level 3 provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-guardian-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: flatten artifact dir
        run: |
          # download-artifact creates one subdir per artifact; flatten
          # so action-gh-release can glob them all.
          find dist -type f -exec mv {} dist/ \;

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/oc-guardian-*
          fail_on_unmatched_files: true
          generate_release_notes: true
