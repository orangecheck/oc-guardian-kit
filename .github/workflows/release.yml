name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write   # cosign keyless OIDC + slsa-verifier
  attestations: write

jobs:
  build:
    name: reproducible build · ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83
          targets: ${{ matrix.target }}

      - name: build (frozen + locked + offline for reproducibility)
        run: |
          cargo build --release --frozen --locked --offline \
            --target ${{ matrix.target }} \
            -p oc-guardian-cli

      - name: package
        id: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oc-guardian dist/oc-guardian-${{ matrix.target }}
          cd dist
          tar -czf oc-guardian-${{ matrix.target }}.tar.gz oc-guardian-${{ matrix.target }}
          shasum -a 256 oc-guardian-${{ matrix.target }}.tar.gz > oc-guardian-${{ matrix.target }}.tar.gz.sha256
          echo "tarball=oc-guardian-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: cosign keyless sign
        uses: sigstore/cosign-installer@v3
      - name: sign
        run: |
          cosign sign-blob --yes \
            --output-signature dist/oc-guardian-${{ matrix.target }}.sig \
            --output-certificate dist/oc-guardian-${{ matrix.target }}.cert \
            --bundle dist/oc-guardian-${{ matrix.target }}.bundle \
            dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: SLSA Level 3 provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-guardian-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
