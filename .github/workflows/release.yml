name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # cosign keyless OIDC + SLSA provenance attestation
  attestations: write
  packages: write # push the oc-guardian image to ghcr.io

jobs:
  build:
    name: reproducible build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
    steps:
      - uses: actions/checkout@v5
      - name: install linux deps
        if: runner.os == 'Linux'
        # libdbus-1-dev is required by the keyring crate's
        # sync-secret-service feature (Linux keyring backend
        # under libsecret/gnome-keyring/KWallet). macOS keychain
        # + Windows Credential Vault use OS-native APIs and
        # need no system deps.
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # --locked pins the build to Cargo.lock for byte-exact dep
      # versions — same reproducibility guarantee as --frozen, but
      # without the --offline implication (--frozen = --locked +
      # --offline; CI runners don't have a populated cargo cache).
      - name: build
        run: |
          cargo build --release --locked \
            --target ${{ matrix.target }} \
            -p oc-guardian-cli

      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/oc-guardian \
             dist/oc-guardian-${{ matrix.target }}
          cd dist
          tar -czf oc-guardian-${{ matrix.target }}.tar.gz \
                   oc-guardian-${{ matrix.target }}
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 oc-guardian-${{ matrix.target }}.tar.gz \
              > oc-guardian-${{ matrix.target }}.tar.gz.sha256
          else
            sha256sum oc-guardian-${{ matrix.target }}.tar.gz \
              > oc-guardian-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: install cosign
        uses: sigstore/cosign-installer@v3

      - name: cosign keyless sign
        run: |
          cosign sign-blob --yes \
            --output-signature dist/oc-guardian-${{ matrix.target }}.sig \
            --output-certificate dist/oc-guardian-${{ matrix.target }}.cert \
            --bundle dist/oc-guardian-${{ matrix.target }}.bundle \
            dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: SLSA Level 3 provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/oc-guardian-${{ matrix.target }}.tar.gz

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oc-guardian-${{ matrix.target }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: flatten artifact dir
        run: |
          # download-artifact creates one subdir per artifact; flatten
          # so action-gh-release can glob them all.
          find dist -type f -exec mv {} dist/ \;

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/oc-guardian-*
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Build + publish the guardian Docker image OrangeCheck deploys to Fly.
  # The image bundles a pinned, SHA-256-verified fedimintd; the build
  # fails unless the verified hash is supplied (repo variable
  # FEDIMINTD_SHA256, pinned to FEDIMINTD_VERSION).
  docker:
    name: guardian image · ghcr.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: verify fedimintd hash is pinned
        run: |
          test -n "${{ vars.FEDIMINTD_SHA256 }}" \
            || (echo "::error::set repo variable FEDIMINTD_SHA256 to the verified upstream fedimintd hash before releasing an image"; exit 1)
      - name: build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/orangecheck/oc-guardian:${{ steps.meta.outputs.tag }}
            ghcr.io/orangecheck/oc-guardian:latest
          build-args: |
            FEDIMINTD_VERSION=${{ vars.FEDIMINTD_VERSION || '0.11.1' }}
            FEDIMINTD_SHA256=${{ vars.FEDIMINTD_SHA256 }}
      - name: install cosign
        uses: sigstore/cosign-installer@v3
      - name: cosign keyless sign the image
        run: |
          cosign sign --yes \
            ghcr.io/orangecheck/oc-guardian@${{ steps.build.outputs.digest }}
