name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: install system deps
        # libdbus-1-dev: required by the keyring crate's
        # sync-secret-service feature (Linux keyring backend
        # under libsecret/gnome-keyring/KWallet).
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: install rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --frozen --locked

      - name: test
        run: cargo test --workspace --frozen --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      # RUSTSEC-2026-0097 (rand 0.8.5 unsound with custom logger using
      # rand::rng()) — the kit only uses rand::rngs::OsRng +
      # RngCore::fill_bytes; the unsound path is structurally
      # unreachable. Ignored with rationale at .cargo/audit.toml; will
      # bump to rand 0.9 once that API migration is scoped.
      - run: cargo audit --ignore RUSTSEC-2026-0097

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny enforces licenses + bans + duplicate-version detection +
      # source registries. Catches things cargo-audit doesn't (license drift,
      # caret-range deps slipping in past our `=X.Y.Z` pin convention,
      # multiple-version diamonds blowing up the dep tree).
      - name: install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
