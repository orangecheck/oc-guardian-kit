name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Every commit in the history, scanned for secrets.
      - name: No secrets in the history (gitleaks 8.30.1, pinned by sha256)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-level warn
      - name: no absolute home-directory paths
        # A path into someone's home directory names a person in a public
        # repo and works on one machine only.
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9_.:/-])/(Users|home)/[A-Za-z0-9_.-]+/' -- . ':!*.lock'; then
            echo "::error::absolute home-directory path in a tracked file"
            exit 1
          fi
      - name: install and build steps name no release
        # A tag written into these steps goes stale at the next release.
        run: |
          if git grep -nIE '(release download|--branch|checkout) v[0-9]' -- '*.md'; then
            echo "::error::an install or build step names a release tag"
            exit 1
          fi
      - name: install system deps
        # libdbus-1-dev: required by the keyring crate's
        # sync-secret-service feature (Linux keyring backend
        # under libsecret/gnome-keyring/KWallet).
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: install rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
          components: rustfmt, clippy

      - name: cache
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets --frozen --locked

      - name: test
        run: cargo test --workspace --frozen --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      # RUSTSEC-2026-0097 (rand 0.8.5 unsound with custom logger using
      # rand::rng()) — the kit only uses rand::rngs::OsRng +
      # RngCore::fill_bytes; the unsound path is structurally
      # unreachable. Ignored with rationale at .cargo/audit.toml; will
      # bump to rand 0.9 once that API migration is scoped.
      - run: cargo audit --ignore RUSTSEC-2026-0097

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny enforces licenses + bans + duplicate-version detection +
      # source registries. Catches things cargo-audit doesn't (license drift,
      # caret-range deps slipping in past our `=X.Y.Z` pin convention,
      # multiple-version diamonds blowing up the dep tree).
      - name: install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace
